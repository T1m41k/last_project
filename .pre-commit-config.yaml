repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        args: [--strict, --config-file=pyproject.toml]
        files: ^app/
        additional_dependencies:
          - aiogram==3.15.0
          - fastapi==0.115.6
          - pydantic==2.9.2
          - pydantic-settings==2.7.1
          - SQLAlchemy==2.0.36
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: no-blank-lines-in-functions
        name: no blank lines between statements in function bodies
        entry: python scripts/check_function_blank_lines.py
        language: system
        types: [python]
